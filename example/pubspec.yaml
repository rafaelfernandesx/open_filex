name: open_filex_example
description: Demonstrates how to use the open_filex plugin.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  # The iOS runner adopts the UIScene lifecycle (FlutterSceneDelegate /
  # FlutterImplicitEngineDelegate), which requires Flutter 3.38 or later.
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  open_filex:
    path: ../
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
